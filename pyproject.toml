[project]
name = "FindersKeepers"
version = "0.1.0"
description = "Build and game data tooling for the Finders Keepers KCD2 mod."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
treasure-data = "treasure_data.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "tools"
module-name = "treasure_data"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
